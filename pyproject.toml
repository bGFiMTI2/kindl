[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kindl"
version = "0.1.0"
description = "Educational Amazon Kindle delivery protocol client"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["kindle", "kfx", "protocol", "downloader", "education"]
dependencies = [
  "click>=8.1,<9",
  "cryptography>=42",
  "httpx>=0.27",
  "tabulate>=0.9,<1",
]

[project.scripts]
kindl = "kindl.cli:main"
amzn-device-link = "kindl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kindl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100
extend-exclude = [".uv-cache"]
